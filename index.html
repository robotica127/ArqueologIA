<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArqueologIA</title>

  <!-- estilos -->
  <link rel="stylesheet" href="estilos/base.css">
  <link rel="stylesheet" href="estilos/encabezado.css">
  <link rel="stylesheet" href="estilos/chat.css">
  <link rel="stylesheet" href="estilos/mensaje.css">
  <link rel="stylesheet" href="estilos/entrada.css">
  <link rel="stylesheet" href="estilos/escribiendo.css">
</head>
<body>

  <!-- encabezado -->
  <header class="encabezado">
    <div class="encabezado-interno">
      <div class="encabezado-titulo">
        <h1>ArqueologIA</h1>
        <p>Experto en arqueología y robótica FLL</p>
      </div>
      <button id="btn-nueva-conversacion">Nueva conversación</button>
    </div>
  </header>

  <!-- area donde aparecen los mensajes -->
  <div id="area-chat"></div>

  <!-- barra de abajo para escribir -->
  <div class="barra-entrada">
    <div class="barra-entrada-interna">
      <select id="selector-servicio"></select>
      <input
        type="text"
        id="campo-mensaje"
        placeholder="Escribe tu pregunta sobre arqueología o FLL..."
        autocomplete="off"
      >
      <button id="btn-enviar">Enviar</button>
    </div>
  </div>

  <script type="module" src="js/script.js"></script>
</body>
</html>
